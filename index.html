<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Quiz Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background-color: #16213e;
            border-radius: 16px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: #e94560;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .meme-box {
            width: 100%;
            height: 250px;
            background-color: #0f3460;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .meme-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #0f3460;
            color: #fff;
            border: 2px solid #533483;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #533483;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .action-btn {
            background-color: #e94560;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .action-btn:hover {
            background-color: #ff6b81;
        }

        .hidden {
            display: none;
        }

        .result-title {
            font-size: 1.8rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 遊戲進行畫面 -->
    <div id="quiz-screen">
        <div class="header">
            <span id="progress-text">題號：1 / 5</span>
            <span id="score-text">得分：0</span>
        </div>
        
        <div class="meme-box">
            <img id="meme-img" src="" alt="Meme Reaction">
        </div>

        <div class="question-text" id="question-text">題目載入中...</div>

        <div class="options-grid" id="options-container">
            <!-- 動態生成選項 -->
        </div>

        <button id="next-btn" class="btn action-btn hidden">下一題</button>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title" id="result-rank">稱號載入中...</div>
        <div class="result-score" id="final-score">最終得分：0</div>
        
        <div class="meme-box">
            <img id="result-meme-img" src="" alt="Result Meme">
        </div>

        <button id="restart-btn" class="btn action-btn">再玩一次</button>
    </div>
</div>

<script>
   // 1. 迷因圖片資料庫 (採用開放外連與高度穩定的 CDN)
const MEME_DATABASE = {
    correct: [
        "./images/correct1.jpg",
        "./images/correct2.jpg",
        "./images/correct3.jpg",
        "./images/correct4.jpg",
        "./images/correct5.jpg",
        "./images/correct6.jpg",
        "./images/correct7.jpg"
    ],
    wrong: [
        "./images/wrong1.jpg",
        "./images/wrong2.png",
        "./images/wrong3.jpg",
        "./images/wrong4.jpg",
        "./images/wrong5.jpg",
        "./images/wrong6.jpg",
        "./images/wrong7.jpg"
    ],
    result: {
        master: "./images/doge.jpg",
        intern: "./images/success_kid.jpg",
        novice: "./images/sad_pepe.jpg"
    }
};
    
let defaultMeme = "./images/c5.jpg";

    // 2. 測試題庫 (可自行替換或擴充)
    const QUESTIONS = [
        {
            question: "「HTTP 404」代表什麼意思？",
            options: ["伺服器錯誤", "找不到網頁", "禁止存取", "連線逾時"],
            answer: 1
        },
        {
            question: "JavaScript 中用來宣告「常數」的關鍵字是？",
            options: ["var", "let", "const", "static"],
            answer: 2
        },
        {
            question: "Git 中用來將本地變更推送至遠端倉庫的指令是？",
            options: ["git pull", "git commit", "git push", "git checkout"],
            answer: 2
        },
        {
            question: "下列何者不屬於網頁前端三劍客之一？",
            options: ["HTML", "CSS", "Python", "JavaScript"],
            answer: 2
        },
        {
            question: "CSS 中用來調整文字大小的屬性是？",
            options: ["text-size", "font-style", "font-size", "text-style"],
            answer: 2
        }
    ];

    // 3. 洗牌抽卡管理類別
    class MemeManager {
        constructor(database) {
            this.db = database;
            this.reset();
        }

        reset() {
            this.correctPool = [...this.db.correct].sort(() => Math.random() - 0.5);
            this.wrongPool = [...this.db.wrong].sort(() => Math.random() - 0.5);
        }

        getCorrectMeme() {
            if (this.correctPool.length === 0) {
                this.correctPool = [...this.db.correct].sort(() => Math.random() - 0.5);
            }
            return this.correctPool.pop();
        }

        getWrongMeme() {
            if (this.wrongPool.length === 0) {
                this.wrongPool = [...this.db.wrong].sort(() => Math.random() - 0.5);
            }
            return this.wrongPool.pop();
        }
    }

    // 4. 遊戲控制邏輯
    const memeManager = new MemeManager(MEME_DATABASE);
    let currentQuestionIndex = 0;
    let score = 0;
    let defaultMeme = "https://i.imgur.com/3N4oXW2.jpg";

    // DOM 元素
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const memeImg = document.getElementById('meme-img');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const nextBtn = document.getElementById('next-btn');
    const resultRank = document.getElementById('result-rank');
    const finalScore = document.getElementById('final-score');
    const resultMemeImg = document.getElementById('result-meme-img');
    const restartBtn = document.getElementById('restart-btn');

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        memeManager.reset();
        quizScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        scoreText.textContent = `得分：${score}`;
        loadQuestion();
    }

    function loadQuestion() {
        const q = QUESTIONS[currentQuestionIndex];
        progressText.textContent = `題號：${currentQuestionIndex + 1} / ${QUESTIONS.length}`;
        questionText.textContent = q.question;
        memeImg.src = defaultMeme;
        nextBtn.classList.add('hidden');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = opt;
            btn.onclick = () => handleAnswer(index);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedIndex) {
        const q = QUESTIONS[currentQuestionIndex];
        const buttons = optionsContainer.querySelectorAll('.btn');
        
        // 禁用所有按鈕
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === q.answer) {
            score += 20;
            scoreText.textContent = `得分：${score}`;
            memeImg.src = memeManager.getCorrectMeme();
            buttons[selectedIndex].style.backgroundColor = '#2ed573';
        } else {
            memeImg.src = memeManager.getWrongMeme();
            buttons[selectedIndex].style.backgroundColor = '#ff4757';
            buttons[q.answer].style.backgroundColor = '#2ed573';
        }

        if (currentQuestionIndex < QUESTIONS.length - 1) {
            nextBtn.classList.remove('hidden');
        } else {
            setTimeout(showResult, 1500);
        }
    }

    function showResult() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        finalScore.textContent = `最終得分：${score} 分`;

        if (score >= 80) {
            resultRank.textContent = "🏆 迷因大師 (Master)";
            resultMemeImg.src = MEME_DATABASE.result.master;
        } else if (score >= 40) {
            resultRank.textContent = "😎 迷因實習生 (Intern)";
            resultMemeImg.src = MEME_DATABASE.result.intern;
        } else {
            resultRank.textContent = "🐣 迷因新手 (Novice)";
            resultMemeImg.src = MEME_DATABASE.result.novice;
        }
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        loadQuestion();
    };

    restartBtn.onclick = startGame;

    // 初始化啟動遊戲
    startGame();
</script>

</body>
</html>
