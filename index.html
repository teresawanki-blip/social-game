let currentIndex = 0;
let score = 0;

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  score = 0;
  currentIndex = 0;
  loadQuestion();
}

function loadQuestion() {
  const q = questions[currentIndex];
  document.getElementById("scenarioText").innerText = q.scenario;
  document.getElementById("progressText").innerText = (currentIndex + 1) + " / " + questions.length;
  document.getElementById("scoreText").innerText = score;
  document.getElementById("progressBar").style.width = ((currentIndex + 1) / questions.length * 100) + "%";
  
  const optionsDiv = document.getElementById("optionsContainer");
  optionsDiv.innerHTML = "";
  
  document.getElementById("feedbackBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";

  q.options.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "btn-option";
    btn.innerText = opt.text;
    btn.onclick = () => selectOption(opt);
    optionsDiv.appendChild(btn);
  });
}

function selectOption(opt) {
  const feedback = document.getElementById("feedbackBox");
  let memeImgUrl = "";

  if (opt.correct) {
    score += 1;
    document.getElementById("scoreText").innerText = score;
    feedback.className = "feedback-box correct";
    memeImgUrl = correctMemes[Math.floor(Math.random() * correctMemes.length)];
  } else {
    feedback.className = "feedback-box wrong";
    memeImgUrl = wrongMemes[Math.floor(Math.random() * wrongMemes.length)];
  }

  feedback.innerHTML = `
    <div class="meme-container">
      <img src="${memeImgUrl}" class="meme-img" alt="Meme">
    </div>
    <div>${opt.explanation}</div>
    <div class="compare-text">${opt.compare}</div>
  `;
  feedback.style.display = "block";
  
  const btns = document.querySelectorAll(".btn-option");
  btns.forEach(b => {
    b.classList.add("disabled");
    b.style.pointerEvents = "none";
  });
  
  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  let title = "";
  let badge = "";
  let desc = "";
  let finalMeme = "";

  if (score >= 13) {
    badge = "🕵️‍♂️";
    title = "社交偵探大師";
    desc = "太厲害了！你擁有極敏銳的觀察力，能精準分辨對方的微表情、眼神與背後真實的意圖！";
    finalMeme = resultMemes.master;
  } else if (score >= 8) {
    badge = "🔍";
    title = "實習偵探";
    desc = "做得不錯！你已經掌握了一半以上的判斷力。有時候我們容易誤會別人的動機，下次記得多觀察對方『事後有沒有道歉』或『有沒有嘲笑』喔！";
    finalMeme = resultMemes.intern;
  } else {
    badge = "🛡️";
    title = "警覺小偵探";
    desc = "你的警覺性很高！但有時候容易把對方的『無心之失/意外』過度解讀為『故意攻擊』。當你感到生氣時，試著先讓情緒溫度計降溫，再觀察對方的眼神吧！";
    finalMeme = resultMemes.beginner;
  }

  document.getElementById("gameArea").innerHTML = `
    <div style="text-align:center; padding: 10px 0;">
      <div style="font-size: 20px; font-weight: bold; color: #555;">你的總得分：${score} / 15</div>
      <div class="score-badge">${badge}</div>
      <h3 style="color:#007aff; font-size:26px; margin: 5px 0;">稱號：${title}</h3>
      <div class="meme-container">
        <img src="${finalMeme}" class="result-meme" alt="Final Meme">
      </div>
      <p style="color:#3a3a3c; font-size:18px; line-height:1.8; text-align: left; background: #f8f9fa; padding: 20px; border-radius: 16px; margin: 15px 0;">
        ${desc}
      </p>
      <button class="btn-main" onclick="location.reload()">重新挑戰 ↺</button>
    </div>
  `;
}
</script>
